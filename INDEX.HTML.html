
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Link para WhatsApp</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrious/dist/qrious.min.js"></script>
  <style>
    #qr-container canvas {
      margin: 1rem auto;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">
    <h2 class="text-2xl font-bold text-green-600 mb-4 text-center">Gerador de Link para WhatsApp</h2>

    <label class="block mb-2 text-sm font-semibold" for="number">Número de WhatsApp (com DDD e país):</label>
    <input type="text" id="number" placeholder="Ex: 5511999998888" class="w-full p-3 border border-gray-300 rounded mb-4" />

    <label class="block mb-2 text-sm font-semibold" for="message">Mensagem:</label>
    <textarea id="message" rows="4" placeholder="Digite sua mensagem personalizada..." class="w-full p-3 border border-gray-300 rounded mb-4"></textarea>

    <label class="block mb-2 text-sm font-semibold" for="logo">Imagem no centro do QR Code (opcional):</label>
    <input type="file" id="logo" accept="image/*" class="w-full mb-4" />

    <button onclick="generateLink()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded mb-4">Gerar Link</button>

    <div id="output" class="text-center space-y-4"></div>
  </div>

  <script>
    let generatedUrl = "";

    function generateLink() {
      const number = document.getElementById('number').value.replace(/\D/g, '');
      const message = document.getElementById('message').value;
      const logoInput = document.getElementById('logo');

      if (!number || !message) {
        alert("Preencha todos os campos.");
        return;
      }

      generatedUrl = `https://wa.me/${number}?text=${encodeURIComponent(message)}`;

      const output = document.getElementById('output');
      output.innerHTML = `
        <div>
          <p class="font-semibold">Link gerado:</p>
          <div class="flex items-center space-x-2 justify-center">
            <input type="text" id="whats-link" value="${generatedUrl}" readonly class="w-full p-2 border border-gray-300 rounded" />
            <button onclick="copyLink()" class="bg-gray-200 px-3 py-1 rounded hover:bg-gray-300">Copiar</button>
          </div>
          <a href="${generatedUrl}" target="_blank" class="inline-block mt-2 text-green-600 hover:underline">Testar link</a>
        </div>
        <div id="qr-container"></div>
      `;

      const qr = new QRious({
        element: document.createElement('canvas'),
        value: generatedUrl,
        size: 250,
        level: 'H'
      });

      const qrContainer = document.getElementById('qr-container');
      qrContainer.innerHTML = '';
      qrContainer.appendChild(qr.element);

      if (logoInput.files.length > 0) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const ctx = qr.element.getContext('2d');
          const logo = new Image();
          logo.onload = function() {
            const size = qr.element.width / 5;
            const x = (qr.element.width - size) / 2;
            const y = (qr.element.height - size) / 2;
            ctx.fillStyle = "white";
            ctx.fillRect(x, y, size, size);
            ctx.drawImage(logo, x, y, size, size);
          }
          logo.src = event.target.result;
        }
        reader.readAsDataURL(logoInput.files[0]);
      }
    }

    function copyLink() {
      const input = document.getElementById("whats-link");
      input.select();
      input.setSelectionRange(0, 99999);
      document.execCommand("copy");
      alert("Link copiado para a área de transferência!");
    }
  </script>
</body>
</html>
